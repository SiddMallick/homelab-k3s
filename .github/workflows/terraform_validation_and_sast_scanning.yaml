name: "IaC Validation & Security Scan"

on:
    push:
        branches:
            - '**'
        tags:
            - '**'
        
    pull_request:
        branches:
            - '**'
        types:
            - opened
            - synchronize
            - reopened

jobs:
    terraform-lint:
        name: "Terraform Lint"
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: "1.5.0"
            - name: Check Format
              run: terraform fmt -check -recursive
        
    documentation-check:
        name: "documentation check"
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Check README in terraform/
              run: |
                if [ ! -f "terraform/README.md" ]; then
                    echo "Error: README.md not found in the terraform/ directory"
                    exit 1
                fi
        
    kics-scan:
        name: "KICS Security Scan"
        runs-on: ubuntu-22.04
        needs:
            - terraform-lint
            - documentation-check
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            
            - name: Run KICS Scan
              uses: checkmarx/kics-github-action@v2.1.20
              with:
                path: terraform/
                ignore_on_exit: 'none'
                output_path: results/
            
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: kics-results
                path: results/