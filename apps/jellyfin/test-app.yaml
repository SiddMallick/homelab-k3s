apiVersion: v1
kind: Pod
metadata:
  name: smb-test
spec:
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "touch /data/testfile && sleep 3600"]
      volumeMounts:
        - mountPath: /data
          name: smb
  volumes:
    - name: smb
      persistentVolumeClaim:
        claimName: smb-pvc