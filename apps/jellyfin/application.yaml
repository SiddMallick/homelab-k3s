apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd

spec:
  project: default

  sources:
    # Helm chart source
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.2.0
      helm:
        valueFiles:
        - $values/apps/jellyfin/values-dev.yaml

    # This is for creating PVC before helm deployment of the jellyfin server
    - repoURL: https://github.com/SiddMallick/homelab-k3s
      targetRevision: master
      path: apps/jellyfin

    # Values repo
    - repoURL: https://github.com/SiddMallick/homelab-k3s
      targetRevision: master
      ref: values #Used as alias in the helm chart source

  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin


# If you want to auto-sync, uncomment this
  syncPolicy:
    automated:
      prune: true
      selfHeal: true