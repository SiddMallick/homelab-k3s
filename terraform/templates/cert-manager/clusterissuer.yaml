apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    email: ${email}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - dns01:
        cloudflare:
          email: ${email}
          apiTokenSecretRef:
            name: ${secret-name} # <- Create this secret first
            key: api-token
      selector:
        dnsZones:
          - "siddhomelab.cc"