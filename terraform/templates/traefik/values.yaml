ingressRoute:
  dashboard:
    enabled: false

providers:
  kubernetesGateway:
    enabled: true #Creates a gateway class

gateway:
  enabled: false

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80

  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443