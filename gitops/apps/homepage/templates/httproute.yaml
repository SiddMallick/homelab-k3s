{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name}}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    environment: {{ .Values.environment }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gatewayName }}
      namespace: {{ .Values.httproute.gatewayNamespace }}
  hostnames:
    - "{{ .Values.httproute.hostname }}"
  rules:
    - matches:
        - path:
            type: {{ .Values.httproute.pathType | default "PathPrefix" }}
            value: {{ .Values.httproute.path | default "/" }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.httproute.port.number }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ print .Release.Name "-ratelimit" }}

        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ print .Release.Name "-latency-circuit-breaker" }}

        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ print .Release.Name "-waf-crs" }}

{{- end }}