apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }} 
  namespace: {{ .Release.Namespace }}
  labels:
    svc: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}