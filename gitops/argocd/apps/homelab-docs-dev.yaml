apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-docs-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: docs=msiddhartha1600/docusaurus-homelab-docs
    argocd-image-updater.argoproj.io/docs.tag-pattern: "^[a-f0-9]{7,40}$"
    argocd-image-updater.argoproj.io/docs.update-strategy: latest
    argocd-image-updater.argoproj.io/docs.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/docs.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: master
    argocd-image-updater.argoproj.io/write-back-target: "gitops/apps/homelab-docs/values-dev.yaml"

spec:
  project: default

  sources:
    # Values repo
    - repoURL: git@github.com:SiddMallick/homelab-k3s.git
      targetRevision: master
      ref: values #Used as alias in the helm chart source

    # Helm chart and certificate source
    - repoURL: git@github.com:SiddMallick/homelab-k3s.git
      path: gitops/apps/homelab-docs
      targetRevision: master
      helm:
        valueFiles:
        - $values/gitops/apps/homelab-docs/values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: apps-dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# # If you want to auto-sync, uncomment this
  # syncPolicy:
  #   syncOptions:
  #     - CreateNamespace=true

